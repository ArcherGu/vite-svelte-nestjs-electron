  - undici@6.28.0 || 7.29.0
  - js-yaml@4.3.1
  - nanoid@3.3.16 || 3.3.18
  - tar@7.5.21

overrides:
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^5.0.0
  brace-expansion@<1.1.18: ^5.0.0
  brace-expansion@>=2.0.0 <2.1.2: ^5.0.0
  brace-expansion@>=2.0.0 <2.1.3: ^5.0.0
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
