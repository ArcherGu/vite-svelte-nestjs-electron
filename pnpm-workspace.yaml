  fast-uri@>=3.0.0 <=3.1.3: ^4.0.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.16: ^3.3.16
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  tar@<=7.5.20: ^7.5.21
  undici@<6.28.0: ^6.28.0

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
